[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "infer-rsi"
version = "0.1.0"
description = "Experiment ledger and statistical gate for inference tuning — three-state decisions, ABBA repetitions, scoped knowledge cards."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["inference", "tuning", "benchmark", "statistics", "knowledge-base"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
# Pure standard library at runtime.
dependencies = []

[project.optional-dependencies]
dev = []

[project.urls]
Homepage = "https://github.com/wangzhao-11a/infer-rsi"

[tool.hatch.build.targets.wheel]
packages = ["infer_rsi"]